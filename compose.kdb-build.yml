#
# Build the openbq-kdb service's image from kdb-x/ (the recipe downloads KDB-X from KX at build time; this repository
# ships no KX software and no licence) instead of pulling the default private image (amd64 only, KDB_IMAGE).
#   docker compose -f docker-compose.yml -f compose.kdb-build.yml --profile live build openbq-kdb
#   docker compose -f docker-compose.yml -f compose.kdb-build.yml --profile live up -d
# Everything else about openbq-kdb (volumes, crash recovery, licence mount, network) comes from
# docker-compose.yml unchanged.
services:
  openbq-kdb:
    build:
      context: kdb-x
      args:
        KX_VERSION: ${KX_VERSION:-~latest~}
    image: openbq-kdb-x:local
