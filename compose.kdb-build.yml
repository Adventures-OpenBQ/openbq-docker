#
# Build kdb from kdb-x/ (the recipe downloads KDB-X from KX at build time; this repository
# ships no KX software and no licence) instead of pulling ghcr.io/artcashin/kdb-x:amd64.
#   docker compose -f docker-compose.yml -f compose.kdb-build.yml --profile live build kdb
#   docker compose -f docker-compose.yml -f compose.kdb-build.yml --profile live up -d
# Everything else about kdb (volumes, crash recovery, licence mount, network) comes from
# docker-compose.yml unchanged.
services:
  kdb:
    build:
      context: kdb-x
      args:
        KX_VERSION: ${KX_VERSION:-~latest~}
    image: openbq-kdb-x:local
