[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "live-grid"
version = "10.0.0"
description = "OpenBB Workspace live_grid backend streaming EODHD websocket prices"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Official EODHD SDK, pinned to a GitHub commit: the PyPI release (1.0.32)
    # can sys.exit() on API errors, has no request timeouts, and predates the
    # SDK's typed error handling.
    "eodhd @ https://github.com/EodHistoricalData/EODHD-APIs-Python-Financial-Library/archive/f98e69d797140ca03f16fa7451046d84aab9643e.tar.gz",
    "openbq-kdb",
    "pandas",
    "httpx>=0.27",
    "polars>=1.20",
    "pyyaml>=6.0",
    # openbq-docker v10: the chart seam's read-back of days eod-dump flushed to the
    # Delta Lake store (app/lake.py). pyarrow is what DeltaTable.to_pandas needs.
    "deltalake>=1.0",
    "pyarrow>=16",
]

[project.optional-dependencies]
# moto[server]: test_lake_readback.py runs a ThreadedMotoServer S3 fake (D26).
dev = ["pytest", "pytest-asyncio", "httpx", "ruff==0.15.22", "moto[server]"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: hits the live EODHD API; deselected by default",
]
addopts = "-m 'not network'"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
