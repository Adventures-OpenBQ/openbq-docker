[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openbq-ta"
version = "0.1.0"
description = "The OpenBQ study engine: registry, two-pass compute, built-in studies and the @study decorator"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["polars>=1.20"]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.15.22"]

[tool.setuptools]
packages = ["openbq_ta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
