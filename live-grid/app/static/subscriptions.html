<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subscriptions</title>
<style>
  :root { color-scheme: light dark; --line: #8883; --dim: #8888; --bad: #c33; }
  /* Canvas/CanvasText, not the frame's default white: under a dark color-scheme the
     text turns light, and on the embedding app's white frame it vanished. */
  body { font: 13px/1.5 system-ui, sans-serif; margin: 0; padding: 12px;
         background: Canvas; color: CanvasText; }
  header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: currentColor; }
  .count { font-variant-numeric: tabular-nums; }
  form { display: flex; gap: 6px; margin-bottom: 12px; }
  input { flex: 1; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px;
          background: transparent; color: inherit; font: inherit; }
  button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px;
           background: transparent; color: inherit; font: inherit; cursor: pointer; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--dim); margin: 14px 0 4px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 3px 0;
       border-bottom: 1px solid var(--line); }
  li span { flex: 1; font-variant-numeric: tabular-nums; }
  li.leased { color: var(--dim); }
  li.leased em { font-style: normal; font-size: 11px; }
  .err { color: var(--bad); min-height: 1.4em; margin-bottom: 6px; }
  .empty { color: var(--dim); padding: 3px 0; }
</style>
</head>
<body>
<header>
  <h1>EODHD</h1>
  <div class="bar"><i id="fill" style="width:0"></i></div>
  <span class="count" id="count">–</span>
</header>
<p class="err" id="err"></p>
<form id="add">
  <input id="sym" placeholder="Add a symbol (AAPL, BTC-USD, EURUSD)" autocomplete="off">
  <button type="submit">Add</button>
</form>
<div id="groups"></div>
<script>
const $ = (id) => document.getElementById(id);

// The API sits beside this page, wherever the page is served: /api/subscriptions on
// live-grid itself, /grid/api/subscriptions behind the gateway (funnel-gateway server.mjs).
const API = new URL("api/subscriptions", location.href).pathname;

// Behind the gateway the page loads without a credential -- a frame cannot send one -- and
// asks the app that framed it (the OpenBB widget protocol, which BDOBB speaks: openbb-connect,
// answered by openbb-auth when this frame shares the backend's origin, then always by
// openbb-params-update). Opened directly on live-grid, the browser's own Basic credential
// already covers same-origin fetches, so no header is needed and none is waited for long.
const auth = new Promise((resolve) => {
  if (window.parent === window) return resolve({});
  const done = (headers) => { window.removeEventListener("message", onMessage); resolve(headers); };
  function onMessage(e) {
    if (e.source !== window.parent || !e.data || typeof e.data !== "object") return;
    if (e.data.type === "openbb-auth" && e.data.headers && typeof e.data.headers === "object") done(e.data.headers);
    else if (e.data.type === "openbb-params-update") done({});
  }
  window.addEventListener("message", onMessage);
  window.parent.postMessage({ type: "openbb-connect" }, "*");
  setTimeout(() => done({}), 2000);
});

function render(d) {
  $("count").textContent = `${d.used} / ${d.cap}`;
  $("fill").style.width = `${Math.min(100, (d.used / d.cap) * 100)}%`;
  const leased = new Set(d.leased);
  $("groups").innerHTML = "";
  for (const [name, syms] of Object.entries(d.groups)) {
    const h = document.createElement("h2");
    h.textContent = name;
    $("groups").append(h);
    const ul = document.createElement("ul");
    if (!syms.length) {
      const p = document.createElement("li");
      p.className = "empty";
      p.textContent = "none";
      ul.append(p);
    }
    for (const s of syms) {
      const li = document.createElement("li");
      const label = document.createElement("span");
      label.textContent = s;
      li.append(label);
      const b = document.createElement("button");
      b.textContent = "Remove";
      // `^` stays literal (^GSPC): the gateway refuses a percent sign in a path.
      b.onclick = () => call("DELETE", `${API}/${encodeURIComponent(s).replace(/%5E/gi, "^")}`);
      li.append(b);
      ul.append(li);
    }
    $("groups").append(ul);
  }
  // Leases are shown so the budget adds up, but they are not ours to remove --
  // they lapse on their own TTL.
  const held = d.leased.filter((s) => !d.pinned.includes(s));
  if (held.length) {
    const h = document.createElement("h2");
    h.textContent = "Leased by quotes";
    $("groups").append(h);
    const ul = document.createElement("ul");
    for (const s of held) {
      const li = document.createElement("li");
      li.className = "leased";
      li.innerHTML = `<span></span><em>expires on its own</em>`;
      li.querySelector("span").textContent = s;
      ul.append(li);
    }
    $("groups").append(ul);
  }
}

async function call(method, url, body) {
  $("err").textContent = "";
  try {
    const headers = { ...(await auth) };
    if (body) headers["content-type"] = "application/json";
    const r = await fetch(url, {
      method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
    });
    const d = await r.json();
    if (!r.ok) { $("err").textContent = d.detail || `HTTP ${r.status}`; return; }
    render(d);
  } catch (e) {
    $("err").textContent = String(e);
  }
}

$("add").onsubmit = (e) => {
  e.preventDefault();
  const v = $("sym").value.trim();
  if (!v) return;
  $("sym").value = "";
  call("POST", API, { symbol: v });
};

call("GET", API);
setInterval(() => call("GET", API), 15000);
</script>
</body>
</html>
