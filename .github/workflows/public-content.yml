name: Public content
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scanner and publication extractors
        run: |
          python3 -m pip install --require-hashes -r security/requirements.txt
          python3 security/install.py
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Verify shared policy bytes
        run: python3 security/sync.py --check
      - name: Verify privacy and publication failure controls
        run: python3 -m unittest discover -s security -p test_gate.py -v
      - name: Scan current source and complete release ancestry
        run: |
          python3 security/gate.py tree
          python3 security/gate.py history --revision HEAD
      - name: Verify source assembly and privacy checks
        run: python3 -m unittest discover -s workspace/tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the key-mode settings, dashboard and app sync routes
        run: |
          python3 -m pip install --quiet pytest starlette==1.7.0 httpx==0.28.1 anyio==4.15.1
          python3 -m pytest v3/tests -q -p no:cacheprovider
      - name: Test the web profile's compose and Serve configs
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m pytest tests -q -p no:cacheprovider
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the funnel-gateway route contract, server and preflights
        working-directory: funnel-gateway
        run: |
          npm ci --ignore-scripts
          npm test
          node --test ../live-grid/tests/test_timestamp_browser.mjs

  live-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the frozen live and lake dependencies
        run: |
          python3 -m pip install --require-hashes -r requirements.live-build.lock
          python3 -m pip install --no-build-isolation --require-hashes -r live-grid/requirements.lock -r requirements.lake.lock
          python3 -m pip install --no-deps --no-build-isolation ./v10/kdb/source ./openbb-deltalake
          python3 scripts/verify-requests-trust-bundle.py
          python3 -m pip install -c requirements.lock pytest==9.2.0 pytest-asyncio==1.5.0 jsonschema==4.26.0 'moto[server]==5.2.5'
      - name: Test the live grid and Day Chart without provider network access
        working-directory: live-grid
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYKX_UNLICENSED: 'true'
        run: python3 -m pytest tests -q -p no:cacheprovider
      - name: Test the kdb source contracts without a licensed q runtime
        working-directory: v10/kdb/source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYKX_UNLICENSED: 'true'
        run: python3 -m pytest tests -q -p no:cacheprovider
      - name: Test lake storage and day-export source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYKX_UNLICENSED: 'true'
        run: python3 -m pytest scripts/tests openbb-deltalake/tests -q -p no:cacheprovider
