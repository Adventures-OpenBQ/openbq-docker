# Add -f v11/compose.temporaldb-mcp.yaml --profile mcp to the existing v11 topology.
# Existing trusted ingress must route the private authenticated endpoint.
services:
  temporaldb-mcp:
    profiles: [mcp]
    # Same local immutable ID as v11/compose.temporaldb.yaml; no registry pull claim.
    image: sha256:4cfb00a549291940c16fbc53b1d0e42ce5a6cd21da9a51715c7752ef30f21f00
    platform: linux/arm64
    pull_policy: never
    depends_on: [temporaldb-api]
    # Both: temporaldb-api sits on default alone, or on openbq-internal alone once
    # compose.gateway.yaml is applied; openbq-internal is also the Tailscale sidecar's.
    networks: [default, openbq-internal]
    command: [python, -m, temporaldb.mcp.app]
    user: "65532:65532"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
    environment:
      TEMPORALDB_MCP_POLICY_FILE: /run/secrets/mcp-policy.json
      TEMPORALDB_MCP_API_ORIGIN: http://temporaldb-api:8080
      TEMPORALDB_MCP_ALLOWED_HOSTS: ${TEMPORALDB_MCP_ALLOWED_HOSTS:?Explicit JSON host list required}
      TEMPORALDB_MCP_ALLOWED_ORIGINS: ${TEMPORALDB_MCP_ALLOWED_ORIGINS:?Explicit JSON browser origin list required; use [] for non-browser clients}
    volumes:
      - ${TEMPORALDB_MCP_POLICY_HOST:?Private policy readable by uid 65532}:/run/secrets/mcp-policy.json:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
