# Optional equivalent isolated PG substrate; the executable gate creates uniquely
# labelled resources directly so concurrent runs never share database volumes.
services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_PASSWORD: ${WORKSPACE_FIXTURE_POSTGRES_PASSWORD:?generated fixture password required}
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      default:
        aliases: [database]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 1s
      timeout: 3s
      retries: 60
networks:
  default:
    internal: true
