[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openbb-econdb"
version = "1.0.0+openbq.1"
description = "EconDB extension for OpenBB (MIT-era source ported to openbb-core 2) for OpenBQ"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE"]
# Every dependency is pinned in openbq-docker's requirements.lock; the image installs this with --no-deps.
dependencies = ["openbb-core[pandas]>=2.0.1,<3", "aiohttp-client-cache>=0.11", "aiosqlite>=0.20"]

[project.entry-points."openbb_provider_extension"]
econdb = "openbb_econdb:econdb_provider"

[project.entry-points."openbb_core_extension"]
econdb = "openbb_econdb.econdb_router:router"

[tool.hatch.build.targets.wheel]
packages = ["openbb_econdb"]
