# verify-charts.sh only: a fake ODP on the bridge. Never used for a real stack.
services:
  fake-odp:
    profiles: [charts-v12]
    image: openbq-arts-charts:12.0.0
    pull_policy: never
    command: [python, /verify/fake_odp.py]
    volumes: [./v12/verify:/verify:ro]
    read_only: true
    networks: [openbq-internal]
