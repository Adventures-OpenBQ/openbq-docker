[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arts_charts"
version = "0.1.0"
description = "Art's Charts studies and series server: one FastAPI router over one bar source"
requires-python = ">=3.12"
license = { text = "BUSL-1.1" }
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "polars>=1.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
snapshots = ["playwright>=1.64,<2"]
dev = ["pytest", "pytest-asyncio", "ruff==0.15.22", "uvicorn[standard]>=0.29", "psycopg[binary]>=3.2",
       "playwright>=1.64,<2"]

[tool.setuptools]
packages = ["arts_charts", "arts_charts.ta"]

[tool.setuptools.package-data]
arts_charts = ["macros/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
